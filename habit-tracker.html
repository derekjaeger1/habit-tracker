<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface2: #23232f;
      --border: #2e2e3e;
      --accent: #6c63ff;
      --accent2: #a78bfa;
      --success: #34d399;
      --text: #e8e8f0;
      --muted: #7070a0;
      --danger: #f87171;
      --radius: 14px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    header p {
      color: var(--muted);
      margin-top: 0.4rem;
      font-size: 0.95rem;
    }

    .container {
      max-width: 540px;
      margin: 0 auto;
    }

    /* Add habit form */
    .add-form {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 2rem;
    }

    .add-form input {
      flex: 1;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.95rem;
      padding: 0.75rem 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .add-form input::placeholder { color: var(--muted); }
    .add-form input:focus { border-color: var(--accent); }

    .add-form button {
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      color: #fff;
      cursor: pointer;
      font-size: 1.4rem;
      font-weight: 600;
      line-height: 1;
      padding: 0.75rem 1.1rem;
      transition: background 0.2s, transform 0.1s;
    }

    .add-form button:hover { background: var(--accent2); }
    .add-form button:active { transform: scale(0.95); }

    /* Date strip */
    .date-strip {
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      margin-bottom: 1.5rem;
      scrollbar-width: none;
    }

    .date-strip::-webkit-scrollbar { display: none; }

    .date-day {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      padding: 0.5rem 0.7rem;
      transition: border-color 0.2s, background 0.2s;
      min-width: 48px;
      user-select: none;
    }

    .date-day.active {
      border-color: var(--accent);
      background: #6c63ff1a;
    }

    .date-day .day-name {
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .date-day .day-num {
      font-size: 1rem;
      font-weight: 700;
    }

    .date-day.active .day-name,
    .date-day.active .day-num { color: var(--accent2); }

    /* Habit cards */
    .habits-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .habit-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.1rem;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
      overflow: hidden;
    }

    .habit-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--border);
      border-radius: 99px;
      transition: background 0.2s;
    }

    .habit-card.done { background: #34d3991a; border-color: #34d39940; }
    .habit-card.done::before { background: var(--success); }

    /* Checkbox */
    .check-btn {
      background: none;
      border: 2px solid var(--border);
      border-radius: 50%;
      cursor: pointer;
      flex-shrink: 0;
      height: 28px;
      width: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, background 0.2s;
    }

    .check-btn svg { display: none; }
    .habit-card.done .check-btn {
      background: var(--success);
      border-color: var(--success);
    }
    .habit-card.done .check-btn svg { display: block; }

    /* Habit info */
    .habit-info { flex: 1; min-width: 0; }

    .habit-name {
      font-size: 0.98rem;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .habit-card.done .habit-name {
      color: var(--muted);
      text-decoration: line-through;
    }

    .habit-meta {
      color: var(--muted);
      font-size: 0.78rem;
      margin-top: 0.2rem;
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    .streak-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
      background: #6c63ff22;
      border: 1px solid #6c63ff44;
      border-radius: 6px;
      color: var(--accent2);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 1px 7px;
    }

    .streak-badge.hot {
      background: #f97316222;
      border-color: #f9731644;
      color: #fb923c;
    }

    /* Delete button */
    .delete-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
      flex-shrink: 0;
    }

    .delete-btn:hover { color: var(--danger); background: #f8717122; }

    /* Empty state */
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 3rem 1rem;
    }

    .empty svg { opacity: 0.3; margin-bottom: 1rem; }
    .empty p { font-size: 0.95rem; }

    /* Summary bar */
    .summary {
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      gap: 1px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }

    .summary-item {
      flex: 1;
      padding: 0.8rem 0.5rem;
      text-align: center;
    }

    .summary-item + .summary-item {
      border-left: 1.5px solid var(--border);
    }

    .summary-val {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent2);
    }

    .summary-label {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 1px;
    }

    /* Animations */
    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    .habit-card.pop { animation: pop 0.25s ease; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Habit Tracker</h1>
      <p id="today-label"></p>
    </header>

    <form class="add-form" id="add-form">
      <input type="text" id="habit-input" placeholder="Add a new habit..." maxlength="60" autocomplete="off" />
      <button type="submit" aria-label="Add habit">+</button>
    </form>

    <div class="date-strip" id="date-strip"></div>

    <div class="summary" id="summary">
      <div class="summary-item">
        <div class="summary-val" id="sum-done">0</div>
        <div class="summary-label">Done</div>
      </div>
      <div class="summary-item">
        <div class="summary-val" id="sum-total">0</div>
        <div class="summary-label">Total</div>
      </div>
      <div class="summary-item">
        <div class="summary-val" id="sum-pct">0%</div>
        <div class="summary-label">Rate</div>
      </div>
      <div class="summary-item">
        <div class="summary-val" id="sum-best">0</div>
        <div class="summary-label">Best Streak</div>
      </div>
    </div>

    <div class="habits-list" id="habits-list"></div>
  </div>

  <script>
    // ── Storage helpers ──────────────────────────────────────────────────────
    const STORE_KEY = 'habit_tracker_v1';

    function load() {
      try { return JSON.parse(localStorage.getItem(STORE_KEY)) || { habits: [] }; }
      catch { return { habits: [] }; }
    }

    function save(data) {
      localStorage.setItem(STORE_KEY, JSON.stringify(data));
    }

    // ── Date helpers ─────────────────────────────────────────────────────────
    function dateKey(d) {
      return d.toISOString().slice(0, 10); // 'YYYY-MM-DD'
    }

    function addDays(d, n) {
      const r = new Date(d);
      r.setDate(r.getDate() + n);
      return r;
    }

    // Compute current streak up to (and including) today for a habit
    function calcStreak(habit) {
      const today = new Date();
      let streak = 0;
      let d = new Date(today);
      while (true) {
        const k = dateKey(d);
        if (!habit.completions[k]) break;
        streak++;
        d = addDays(d, -1);
      }
      return streak;
    }

    function calcBestStreak(habit) {
      const keys = Object.keys(habit.completions).filter(k => habit.completions[k]).sort();
      if (!keys.length) return 0;
      let best = 1, cur = 1;
      for (let i = 1; i < keys.length; i++) {
        const prev = new Date(keys[i - 1]);
        const curr = new Date(keys[i]);
        const diff = (curr - prev) / 86400000;
        if (diff === 1) { cur++; best = Math.max(best, cur); }
        else cur = 1;
      }
      return best;
    }

    // ── State ────────────────────────────────────────────────────────────────
    let data = load();
    let selectedDate = new Date();

    // ── Date strip ───────────────────────────────────────────────────────────
    const DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

    function renderDateStrip() {
      const strip = document.getElementById('date-strip');
      strip.innerHTML = '';
      const today = new Date();
      const selKey = dateKey(selectedDate);

      for (let i = -6; i <= 0; i++) {
        const d = addDays(today, i);
        const k = dateKey(d);
        const el = document.createElement('div');
        el.className = 'date-day' + (k === selKey ? ' active' : '');
        el.innerHTML = `<span class="day-name">${DAY_NAMES[d.getDay()]}</span><span class="day-num">${d.getDate()}</span>`;
        el.addEventListener('click', () => {
          selectedDate = d;
          renderDateStrip();
          renderHabits();
        });
        strip.appendChild(el);
      }

      // Scroll to end
      strip.scrollLeft = strip.scrollWidth;
    }

    // ── Habits list ──────────────────────────────────────────────────────────
    function renderHabits() {
      const list = document.getElementById('habits-list');
      const selKey = dateKey(selectedDate);
      list.innerHTML = '';

      if (!data.habits.length) {
        list.innerHTML = `
          <div class="empty">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
              <rect x="9" y="3" width="6" height="4" rx="1"/>
              <path d="M9 12h6M9 16h4"/>
            </svg>
            <p>No habits yet. Add one above!</p>
          </div>`;
        updateSummary();
        return;
      }

      data.habits.forEach((habit, idx) => {
        const done = !!habit.completions[selKey];
        const streak = calcStreak(habit);
        const best = calcBestStreak(habit);

        const card = document.createElement('div');
        card.className = 'habit-card' + (done ? ' done' : '');
        card.innerHTML = `
          <button class="check-btn" aria-label="Toggle habit">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </button>
          <div class="habit-info">
            <div class="habit-name">${escHtml(habit.name)}</div>
            <div class="habit-meta">
              <span class="streak-badge ${streak >= 7 ? 'hot' : ''}">
                ${streak >= 7 ? 'Fire' : 'Streak'} ${streak}d
              </span>
              ${best > streak ? `<span>best ${best}d</span>` : ''}
            </div>
          </div>
          <button class="delete-btn" aria-label="Delete habit" title="Delete">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/>
            </svg>
          </button>`;

        card.querySelector('.check-btn').addEventListener('click', () => toggleHabit(idx, selKey, card));
        card.querySelector('.delete-btn').addEventListener('click', () => deleteHabit(idx));
        list.appendChild(card);
      });

      updateSummary();
    }

    function toggleHabit(idx, dateKey, card) {
      const habit = data.habits[idx];
      habit.completions[dateKey] = !habit.completions[dateKey];
      save(data);
      // Animate then re-render
      card.classList.add('pop');
      card.addEventListener('animationend', () => renderHabits(), { once: true });
      // Immediate visual toggle before re-render
      const done = habit.completions[dateKey];
      card.classList.toggle('done', done);
    }

    function deleteHabit(idx) {
      data.habits.splice(idx, 1);
      save(data);
      renderHabits();
    }

    function updateSummary() {
      const selKey = dateKey(selectedDate);
      const total = data.habits.length;
      const done = data.habits.filter(h => h.completions[selKey]).length;
      const pct = total ? Math.round((done / total) * 100) : 0;
      const best = data.habits.reduce((m, h) => Math.max(m, calcBestStreak(h)), 0);
      document.getElementById('sum-done').textContent = done;
      document.getElementById('sum-total').textContent = total;
      document.getElementById('sum-pct').textContent = pct + '%';
      document.getElementById('sum-best').textContent = best;
    }

    // ── Add habit ────────────────────────────────────────────────────────────
    document.getElementById('add-form').addEventListener('submit', e => {
      e.preventDefault();
      const input = document.getElementById('habit-input');
      const name = input.value.trim();
      if (!name) return;
      data.habits.push({ id: Date.now(), name, completions: {} });
      save(data);
      input.value = '';
      renderHabits();
    });

    // ── Utils ────────────────────────────────────────────────────────────────
    function escHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ── Today label ──────────────────────────────────────────────────────────
    function updateTodayLabel() {
      const selKey = dateKey(selectedDate);
      const todayKey = dateKey(new Date());
      const label = selKey === todayKey ? 'Today' :
        selectedDate.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
      document.getElementById('today-label').textContent = label;
    }

    // Watch selectedDate changes
    const origRenderDate = renderDateStrip;
    renderDateStrip = function () {
      origRenderDate();
      updateTodayLabel();
    };

    // ── Init ─────────────────────────────────────────────────────────────────
    renderDateStrip();
    renderHabits();
  </script>
</body>
</html>
